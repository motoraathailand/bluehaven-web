<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#040b1e">
<title>BLUE HAVEN</title>
<meta name="description" content="BLUE HAVEN — a calm, softly glowing deep-sea garden. By MOTOR AA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23040b1e'/%3E%3Cpath d='M14 34c8-10 22-10 30 0-8 10-22 10-30 0z' fill='%237ff8ff'/%3E%3Cpath d='M44 34l8-7v14z' fill='%237ff8ff'/%3E%3Ccircle cx='22' cy='32' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=r6">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body class="locked">
<canvas id="c"></canvas>
<canvas id="arc" class="hidden"></canvas>

<div id="hud">
  <div class="left">
    <div id="pearlPill" class="pill pearl" aria-live="polite"><span class="pearlDot"></span><b id="pearlCount">0</b></div>
  </div>
  <div class="tools">
    <button id="langBtn" class="pill icon" data-i18n-aria="language"><i data-ic="globe"></i></button>
    <button id="setBtn" class="pill icon" data-i18n-aria="settings"><i data-ic="gear"></i></button>
    <button id="muteBtn" class="pill icon"><span id="icSound"></span></button>
  </div>
</div>
<div id="langMenu" class="menu hidden" role="menu"></div>

<div id="followChip" class="chip hidden"><i data-ic="eye"></i><span id="followArt" class="miniArt"></span><span id="followName"></span>
  <button id="stopFollow" class="mini close sm" data-i18n-aria="stopFollow"><i data-ic="close"></i></button></div>

<div id="hint" class="hidden" aria-hidden="true"></div>
<div id="rail">
  <button id="railDex" class="rbtn" data-i18n-aria="dex"><i data-ic="book"></i></button>
  <button id="railQuest" class="rbtn" data-i18n-aria="quests"><i data-ic="quest"></i></button>
  <button id="railEv" class="rbtn" data-i18n-aria="events"><i data-ic="cal"></i></button>
  <button id="railVisit" class="rbtn" data-i18n-aria="visitTab"><i data-ic="visit"></i></button>
  <button id="railPhoto" class="rbtn" data-i18n-aria="photo"><i data-ic="camera"></i></button>
  <button id="railSleep" class="rbtn" data-i18n-aria="sleep"><i data-ic="moon"></i></button>
</div>
<div id="evBanner" class="hidden"><span id="evText"></span><button id="evWatch" class="mini round" data-i18n-aria="evWatchBtn"><i data-ic="eye"></i></button></div>
<div id="care" class="hidden">
  <div class="cTop"><span id="careArt" class="miniArt"></span><b id="careName"></b><button id="careNameBtn" class="mini round" data-i18n-aria="nameIt"><i data-ic="pencil"></i></button></div>
  <div class="cBond"><span id="careIc"></span><div class="bbar"><i id="careBar"></i></div><span id="careBond" class="num"></span></div>
  <div class="row left careBtns"><button id="careFeed" class="cta small iconOnly" data-i18n-aria="feed"><i data-ic="food" class="big"></i></button>
    <button id="carePet" class="cta small ghost iconOnly" data-i18n-aria="pet"><i data-ic="heart" class="big"></i></button>
    <button id="careDex" class="mini round" data-i18n-aria="dex"><i data-ic="book"></i></button>
    <div id="petDemo" class="petDemo"></div></div>
</div>
<div id="visitBar" class="hidden"><i data-ic="visit"></i><span id="visitNick"></span><button id="visitHeart" class="pill"><span id="visitHearts">♥</span></button><button id="visitHome" class="pill icon" data-i18n-aria="goHome"><i data-ic="home"></i></button></div>
<div id="photoUI" class="hidden">
  <button id="photoExit" class="mini close" data-i18n-aria="close"><i data-ic="close"></i></button>
  <div class="camSlider"><input type="range" id="camUp" min="1" max="20" step="0.1" value="5.5" aria-label="height"></div>
  <div id="photoDemo" class="photoDemo"></div>
  <div class="photoBottom"><div id="filterChips" class="chips"></div><button id="shutter" data-i18n-aria="photo"><i></i></button></div>
  <div id="photoPrev" class="hidden"><img id="photoImg" alt=""><div class="row"><button id="photoSave" class="cta small iconOnly" data-i18n-aria="savePhoto"><i data-ic="download" class="big"></i></button>
    <button id="photoShare" class="cta small ghost iconOnly" data-i18n-aria="share"><i data-ic="share" class="big"></i></button>
    <button id="photoClosePrev" class="mini close" data-i18n-aria="close"><i data-ic="close"></i></button></div></div>
</div>
<div id="flash"></div>
<div id="sleepDim"></div>
<div id="sleepUI" class="hidden"><div class="moon"></div><div id="sleepTime"></div><div id="sleepChips" class="chips"></div>
  <button id="sleepExit" class="cta ghost small iconOnly" data-i18n-aria="wake"><i data-ic="sun" class="big"></i></button></div>
<div id="toast" class="hidden"><div class="tpic"></div><div class="sr" aria-live="polite"><span class="t1"></span> <span class="t2"></span></div></div>

<div id="dock" class="hidden">
  <button id="gamesBtn" class="dockBtn" data-i18n-aria="games"><i data-ic="pad" class="big"></i></button>
  <button id="shopBtn" class="dockBtn warm" data-i18n-aria="grow"><i data-ic="sprout" class="big"></i></button>
</div>

<div id="mgHud" class="hidden">
  <div class="mgBox"><svg viewBox="0 0 44 44" class="ring"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" id="ringFg" class="fg"/></svg><b id="mgTime">40</b></div>
  <div class="mgBox wide"><span class="pearlDot"></span><b id="mgScore">0</b></div>
  <div class="mgBox wide hidden" id="mgMultBox"><b id="mgMult">×1</b></div>
  <div class="mgBox wide hidden" id="mgLivesBox"><span id="mgLives"></span></div>
  <button id="mgEnd" class="pill icon" data-i18n-aria="endEarly"><i data-ic="flag"></i></button>
</div>
<div id="floaters"></div>
<div id="mgDemo" class="hidden" aria-hidden="true"></div>

<div id="gamesPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><span class="headIc"><i data-ic="pad"></i></span><span class="grow"></span><button class="mini close" data-close="gamesPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
    <div id="hubDaily" class="hubDaily"></div>
    <div id="hubArcade" class="games"></div>
    <div class="hubSep"><i data-ic="wave"></i></div>
    <div id="hubRelax" class="games"></div>
  </div>
</div>

<div id="shopPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><span class="headIc warm"><i data-ic="sprout"></i></span><span class="grow"></span><div class="pill pearl small"><span class="pearlDot"></span><b class="pearlMirror">0</b></div><button class="mini close" data-close="shopPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
    <div class="tabs"><button class="tab on" data-tab="life" data-i18n-aria="tabLife"><i data-ic="fish"></i></button>
      <button class="tab" data-tab="decor" data-i18n-aria="tabDecor"><svg viewBox="0 0 24 24" class="ic"><path d="M12 21v-8M12 13c-3 0-5-2-5-5M12 13c3 0 5-2 5-5M12 9V4M7 8V5M17 8V5"/></svg></button>
      <button class="tab" data-tab="sets" data-i18n-aria="tabSets"><i data-ic="star"></i></button></div>
    <div id="shopGrid" class="grid"></div>
    <div id="shopExtra" class="hidden"></div>
  </div>
</div>

<div id="resultPanel" class="sheet hidden">
  <div class="sheetCard center">
    <div id="resGame" class="resGame"></div>
    <div id="resScore" class="resScore"></div>
    <div id="resBest" class="resBest"></div>
    <div class="earned"><span class="bigPearl sm"></span><b id="earnedN">+0</b></div>
    <div id="resBonus" class="resBonus"></div>
    <div class="row">
      <button id="collectBtn" class="cta iconOnly" data-i18n-aria="collect"><i data-ic="check" class="big"></i></button>
      <button id="againBtn" class="cta ghost iconOnly" data-i18n-aria="playAgain"><i data-ic="again" class="big"></i></button>
      <button id="toShopBtn" class="cta ghost iconOnly" data-i18n-aria="toGrow"><i data-ic="sprout" class="big"></i></button>
    </div>
  </div>
</div>

<div id="setPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><span class="headIc"><i data-ic="gear"></i></span><span class="grow"></span><button class="mini close" data-close="setPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
    <div class="setSec">
      <div class="acct"><div id="acAvatar" class="avatar"></div><div class="acTxt"><b id="acName"></b><span id="acMail"></span></div><span id="acSync" class="sync"></span></div>
      <div class="row left"><button id="signOutBtn" class="mini wide round2" data-i18n-aria="signOut"><i data-ic="door"></i></button>
        <button id="deleteBtn" class="mini wide danger round2" data-i18n-aria="deleteAcc"><i data-ic="trash"></i></button></div></div>
    <div class="setSec iconSec"><span class="secIc"><i data-ic="globe"></i></span><div id="setLangs" class="chips"></div></div>
    <div class="setSec iconSec"><span class="secIc"><i data-ic="sound"></i></span><div id="setSound" class="chips"></div></div>
    <div class="setSec iconSec"><span class="secIc"><i data-ic="note"></i></span><div id="setBgm" class="chips"></div></div>
    <p class="note legal" data-i18n="privacy"></p>
    <div class="note credit">MOTOR AA</div>
  </div>
</div>
<div id="delPanel" class="sheet hidden">
  <div class="sheetCard center">
    <div class="delIc"><i data-ic="trash" class="big"></i></div>
    <h3 data-i18n="deleteTitle"></h3>
    <p class="delBody" data-i18n="deleteBody"></p>
    <div class="row">
      <button id="delNo" class="cta ghost"><span data-i18n="cancel"></span></button>
      <button id="delYes" class="cta danger"><span data-i18n="deleteYes"></span></button>
    </div>
  </div>
</div>

<div id="dexPanel" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><span class="headIc"><i data-ic="book"></i></span><div class="dexHead"><b id="dexProg" class="num"></b><div class="bbar"><i id="dexBar"></i></div></div><button class="mini close" data-close="dexPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
  <div class="howRow" aria-hidden="true"><span class="hw"><i data-ic="eye"></i></span><span class="hw or">/</span><span class="hw"><i data-ic="food"></i></span><span class="hw arrow"><i data-ic="chevR"></i></span><span class="hw gold"><i data-ic="spark"></i></span></div>
  <div id="dexGrid" class="dexGrid"></div></div></div>
<div id="questPanel" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><span class="headIc"><i data-ic="quest"></i></span><span class="grow"></span><button class="mini close" data-close="questPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
  <div id="questList" class="qlist"></div><div id="idleInfo" class="idleInfo"></div></div></div>
<div id="eventPanel" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><span class="headIc"><i data-ic="cal"></i></span><span class="grow"></span><button class="mini close" data-close="eventPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div><div id="evList"></div></div></div>
<div id="visitPanel" class="sheet hidden"><div class="sheetCard"><div class="sheetHead"><span class="headIc"><i data-ic="visit"></i></span><span class="grow"></span><button class="mini close" data-close="visitPanel" data-i18n-aria="close"><i data-ic="close"></i></button></div>
  <div class="setSec">
    <div class="pubRow"><span class="secIc"><i data-ic="home"></i></span><span id="pubState" class="pubIc"></span><button id="pubToggle" class="switch" role="switch" aria-checked="false" data-i18n-aria="pubLabel"><i></i></button></div>
    <div class="inRow"><span class="inIc"><i data-ic="pencil"></i></span><input id="nickInput" maxlength="24" aria-label="nickname"><button id="nickSave" class="mini round" data-i18n-aria="save"><i data-ic="check"></i></button></div>
    <div class="codeRow"><span class="inIc"><i data-ic="key"></i></span><b id="myCode"></b><button id="copyCode" class="mini round" data-i18n-aria="shareCode"><i data-ic="share"></i></button><span id="myHearts" class="hearts"></span></div></div>
  <div class="setSec">
    <div class="inRow"><span class="inIc"><i data-ic="userPlus"></i></span><input id="friendInput" maxlength="12" autocapitalize="characters" placeholder="A B C D 2 3 4 5" aria-label="code"><button id="addFriendBtn" class="mini round" data-i18n-aria="addFriend"><i data-ic="plus"></i></button></div>
    <div id="friendList"></div></div>
  <button id="randomVisit" class="cta wide iconOnly" data-i18n-aria="randomVisit"><i data-ic="dice" class="big"></i><i data-ic="chevR"></i><i data-ic="visit" class="big"></i></button>
</div></div>
<div id="idlePanel" class="sheet hidden"><div class="sheetCard center"><div class="bigPearl"></div><div id="idleAway" class="idleAway"></div>
  <div class="earned"><b id="idleN">+0</b></div><div id="idleCap" class="hidden"></div>
  <div class="row"><button id="idleClaim" class="cta iconOnly" data-i18n-aria="collect"><i data-ic="check" class="big"></i></button></div></div></div>
<div id="namePanel" class="sheet hidden"><div class="sheetCard center"><div id="nameFor" class="nameArt"></div>
  <div class="inRow"><span class="inIc"><i data-ic="pencil"></i></span><input id="nameInput" maxlength="16" aria-label="name"></div><div class="row"><button id="nameSave" class="cta iconOnly" data-i18n-aria="save"><i data-ic="check" class="big"></i></button></div></div></div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>BLUE HAVEN</h1>
    <div class="loop" aria-hidden="true"><span class="lp l1"><i data-ic="pad" class="big"></i></span><span class="la"><i data-ic="chevR"></i></span><span class="lp l2"><span class="pearlDot"></span></span><span class="la"><i data-ic="chevR"></i></span><span class="lp l3"><i data-ic="sprout" class="big"></i></span><span class="la"><i data-ic="chevR"></i></span><span class="lp l4"><i data-ic="fish" class="big"></i></span></div>
    <div id="authBox">
      <button id="googleBtn" class="gbtn"><svg viewBox="0 0 48 48" class="glogo"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span data-i18n="signInGoogle"></span></button>
      <div id="authNote" class="authNote"></div>
      <div id="inAppBox" class="inApp hidden"><p data-i18n="inAppWarn"></p><button id="copyLinkBtn" class="mini round" data-i18n-aria="copyLink"><i data-ic="copy"></i></button></div>
      <div id="whoLine" class="whoLine hidden"></div>
    </div>
    <button id="startBtn" class="startBtn hidden" data-i18n-aria="start"><i data-ic="play" class="big"></i></button>
    <div class="hintline" id="startHint" aria-hidden="true"></div>
    <div class="foot">MOTOR AA</div>
  </div>
</div>
<div id="fade"></div>
<script type="module" src="js/main.js?v=r6"></script>
</body>
</html>
