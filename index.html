<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#040b1e">
<title>BLUE HAVEN — 나만의 심해 정원</title>
<meta name="description" content="BLUE HAVEN — a calm, softly glowing deep-sea garden. Play gentle minigames, gather pearls and grow your own deep sea. By MOTOR AA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23040b1e'/%3E%3Cpath d='M14 34c8-10 22-10 30 0-8 10-22 10-30 0z' fill='%237ff8ff'/%3E%3Cpath d='M44 34l8-7v14z' fill='%237ff8ff'/%3E%3Ccircle cx='22' cy='32' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=r4">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body class="locked">
<canvas id="c"></canvas>
<canvas id="arc" class="hidden"></canvas>

<div id="hud">
  <div class="left">
    <div class="brand"><svg viewBox="0 0 24 24" class="ic"><path d="M3 12c4-5 11-5 15 0-4 5-11 5-15 0z"/><path d="M18 12l3.5-3v6z"/><circle cx="7.5" cy="11.3" r=".6" fill="currentColor"/></svg><span>BLUE HAVEN</span></div>
    <div id="pearlPill" class="pill pearl" aria-live="polite"><span class="pearlDot"></span><b id="pearlCount">0</b></div>
  </div>
  <div class="tools">
    <button id="langBtn" class="pill" data-i18n-aria="language"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langCode">EN</span></button>
    <button id="setBtn" class="pill icon" data-i18n-aria="settings"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
    <button id="muteBtn" class="pill"><svg viewBox="0 0 24 24" class="ic" id="icSound"></svg><span id="muteLabel" class="lbl"></span></button>
  </div>
</div>
<div id="langMenu" class="menu hidden" role="menu"></div>

<div id="followChip" class="chip hidden"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span id="followName"></span>
  <button id="stopFollow" class="mini" data-i18n-aria="stopFollow"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="stopFollow"></span></button></div>

<div id="hint" class="hidden"></div>
<div id="toast" class="hidden"><div class="t1"></div><div class="t2"></div></div>

<div id="dock" class="hidden">
  <button id="gamesBtn" class="dockBtn"><svg viewBox="0 0 24 24" class="ic big"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="17.8" cy="13.8" r=".9" fill="currentColor"/></svg><span data-i18n="games"></span></button>
  <button id="shopBtn" class="dockBtn warm"><svg viewBox="0 0 24 24" class="ic big"><path d="M12 21v-7"/><path d="M12 14c0-3-2-4-2-7a2 2 0 0 1 4 0c0 3-2 4-2 7z"/><path d="M12 16c-2-1-5-1-6-4 2 0 5 1 6 4zM12 16c2-1 5-1 6-4-2 0-5 1-6 4z"/><path d="M5 21h14"/></svg><span data-i18n="grow"></span></button>
</div>

<!-- minigame HUD -->
<div id="mgHud" class="hidden">
  <div class="mgBox"><svg viewBox="0 0 44 44" class="ring"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" id="ringFg" class="fg"/></svg><b id="mgTime">40</b></div>
  <div class="mgBox wide"><span class="pearlDot"></span><b id="mgScore">0</b></div>
  <div class="mgBox wide hidden" id="mgMultBox"><b id="mgMult">×1</b></div>
  <div class="mgBox wide hidden" id="mgLivesBox"><span id="mgLives"></span></div>
  <button id="mgEnd" class="pill"><svg viewBox="0 0 24 24" class="ic"><path d="M5 13l4 4L19 7"/></svg><span data-i18n="endEarly"></span></button>
</div>
<div id="floaters"></div>

<!-- games panel -->
<div id="gamesPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><h3 data-i18n="games"></h3><button class="mini close" data-close="gamesPanel" data-i18n-aria="close"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="hubDaily" class="hubDaily"></div>
    <div class="hubSec" data-i18n="arcade"></div>
    <div id="hubArcade" class="games"></div>
    <div class="hubSec" data-i18n="relax"></div>
    <div id="hubRelax" class="games"></div>
    <div class="note" data-i18n="growsNote"></div>
  </div>
</div>

<!-- shop panel -->
<div id="shopPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><h3 data-i18n="grow"></h3><div class="pill pearl small"><span class="pearlDot"></span><b class="pearlMirror">0</b></div><button class="mini close" data-close="shopPanel" data-i18n-aria="close"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="tabs"><button class="tab on" data-tab="life"><svg viewBox="0 0 24 24" class="ic"><path d="M3 12c4-5 11-5 15 0-4 5-11 5-15 0z"/><path d="M18 12l3.5-3v6z"/></svg><span data-i18n="tabLife"></span></button>
      <button class="tab" data-tab="decor"><svg viewBox="0 0 24 24" class="ic"><path d="M12 21v-8M12 13c-3 0-5-2-5-5M12 13c3 0 5-2 5-5M12 9V4M7 8V5M17 8V5"/></svg><span data-i18n="tabDecor"></span></button></div>
    <div id="shopGrid" class="grid"></div>
  </div>
</div>

<!-- result -->
<div id="resultPanel" class="sheet hidden">
  <div class="sheetCard center">
    <div class="bigPearl"></div>
    <h3 data-i18n="resultTitle"></h3>
    <div id="resScore" class="resScore"></div>
    <div id="resBest" class="resBest"></div>
    <div class="earned"><span data-i18n="earned"></span> <b id="earnedN">+0</b></div>
    <div id="resBonus" class="resBonus"></div>
    <div class="row">
      <button id="collectBtn" class="cta"><svg viewBox="0 0 24 24" class="ic"><path d="M5 13l4 4L19 7"/></svg><span data-i18n="collect"></span></button>
      <button id="againBtn" class="cta ghost"><svg viewBox="0 0 24 24" class="ic"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><span data-i18n="playAgain"></span></button>
      <button id="toShopBtn" class="cta ghost"><svg viewBox="0 0 24 24" class="ic"><path d="M12 21v-7"/><path d="M12 14c0-3-2-4-2-7a2 2 0 0 1 4 0c0 3-2 4-2 7z"/><path d="M5 21h14"/></svg><span data-i18n="toGrow"></span></button>
    </div>
  </div>
</div>

<div id="setPanel" class="sheet hidden">
  <div class="sheetCard">
    <div class="sheetHead"><h3 data-i18n="settings"></h3><button class="mini close" data-close="setPanel" data-i18n-aria="close"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="setSec"><div class="setLbl" data-i18n="account"></div>
      <div class="acct"><div id="acAvatar" class="avatar"></div><div class="acTxt"><b id="acName"></b><span id="acMail"></span><span id="acSync" class="sync"></span></div></div>
      <div class="row left"><button id="signOutBtn" class="mini wide"><svg viewBox="0 0 24 24" class="ic"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg><span data-i18n="signOut"></span></button>
        <button id="deleteBtn" class="mini wide danger"><svg viewBox="0 0 24 24" class="ic"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-i18n="deleteAcc"></span></button></div></div>
    <div class="setSec"><div class="setLbl" data-i18n="language"></div><div id="setLangs" class="chips"></div></div>
    <div class="setSec"><div class="setLbl" data-i18n="sound"></div><div id="setSound" class="chips"></div></div>
    <p class="note" data-i18n="privacy"></p>
    <div class="note"><span data-i18n="provider"></span> · <span data-i18n="musicNote"></span></div>
  </div>
</div>
<div id="delPanel" class="sheet hidden">
  <div class="sheetCard center">
    <h3 data-i18n="deleteTitle"></h3>
    <p class="delBody" data-i18n="deleteBody"></p>
    <div class="row">
      <button id="delNo" class="cta ghost"><span data-i18n="cancel"></span></button>
      <button id="delYes" class="cta danger"><span data-i18n="deleteYes"></span></button>
    </div>
  </div>
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <div class="sample" data-i18n="sample"></div>
    <h1>BLUE HAVEN</h1>
    <div class="sub" data-i18n="subtitle"></div>
    <p class="intro" data-i18n="intro"></p>
    <div id="authBox">
      <button id="googleBtn" class="gbtn"><svg viewBox="0 0 48 48" class="glogo"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span data-i18n="signInGoogle"></span></button>
      <p id="authNote" class="authNote" data-i18n="signInNeed"></p>
      <div id="inAppBox" class="inApp hidden"><p data-i18n="inAppWarn"></p><button id="copyLinkBtn" class="mini"><span data-i18n="copyLink"></span></button></div>
      <div id="whoLine" class="whoLine hidden"></div>
    </div>
    <button id="startBtn" class="cta hidden"><svg viewBox="0 0 24 24" class="ic"><path d="M12 3v13M6 11l6 6 6-6"/><path d="M4 21h16"/></svg><span data-i18n="start"></span></button>
    <div class="hintline" id="startHint"></div>
    <div class="foot"><span data-i18n="provider"></span> · <span data-i18n="musicNote"></span></div>
  </div>
</div>
<div id="fade"></div>
<script type="module" src="js/main.js?v=r4"></script>
</body>
</html>
